name: Preview and promote

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the verified preview artifacts to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: civilmcp-release-${{ github.event_name == 'workflow_dispatch' && 'promotion' || github.ref }}
  # Never cancel a manual promotion midway through a multi-service release.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  VERCEL_CLI_VERSION: 56.3.1
  CIVIL_BILLING_MIGRATIONS: >-
    supabase/migrations/20260720160000_civil_founder_pro.sql
    supabase/migrations/20260720163000_civil_billing_period_guards.sql
    supabase/migrations/20260725120000_civil_deepseek_default_and_pro_models.sql
    supabase/migrations/20260725203000_civil_free_weekly_credits.sql
    supabase/migrations/20260725205900_civil_founder_pro_500_credits.sql
  CIVIL_BILLING_STATE_SQL: >-
    select case
    when to_regclass('public.civil_billing_accounts') is null
      and to_regclass('public.civil_credit_ledger') is null then 'absent'
    when to_regclass('public.civil_billing_accounts') is not null
      and to_regclass('public.civil_credit_ledger') is not null
      and to_regprocedure('public.civil_get_billing_state(text)') is not null
      and to_regprocedure('public.civil_consume_answer_credits(text,text,text)') is not null
      and to_regprocedure('public.civil_refund_answer_credits(text,text)') is not null
      and to_regprocedure('public.civil_sync_stripe_subscription(text,text,text,text,timestamptz,timestamptz,text,timestamptz)') is not null
      and exists (select 1 from information_schema.columns where table_schema = 'public'
        and table_name = 'civil_billing_accounts' and column_name = 'pro_credits_included')
      and exists (select 1 from information_schema.columns where table_schema = 'public'
        and table_name = 'civil_credit_ledger' and column_name = 'credit_pool') then 'ready'
    else 'partial' end;
  CIVIL_BILLING_HARDENING_SQL: >-
    select case when to_regclass('public.civil_stripe_event_ledger') is not null
      and to_regprocedure('public.civil_apply_stripe_subscription_event(text,text,text,text,timestamptz,timestamptz,text,timestamptz,text,text)') is not null
      and exists (select 1 from information_schema.columns where table_schema = 'public'
        and table_name = 'civil_billing_accounts' and column_name = 'stripe_event_id')
      and exists (select 1 from information_schema.columns where table_schema = 'public'
        and table_name = 'civil_billing_accounts' and column_name = 'stripe_event_type')
      then 'ready' else 'partial' end;
  CIVIL_DATA_RPC_STATE_SQL: >-
    select case when to_regprocedure('public.search_civil_source_catalog_public_v1(text,text,text,integer,integer)') is not null
      and to_regprocedure('public.civil_delete_account_data(text)') is not null
      and to_regprocedure('public.list_civil_evidence_feed_v1(text,text,integer,integer)') is not null
      and to_regprocedure('public.civil_evidence_feed_facets_v1()') is not null
      and to_regprocedure('public.civil_evidence_feed_previews_v1(text[],integer,integer)') is not null
      and to_regclass('public.civil_private_library_items') is not null
      and to_regclass('public.civil_living_review_watches') is not null
      and to_regclass('public.civil_mcp_access_keys') is not null
      and to_regclass('public.civil_mcp_library_folders') is not null
      and to_regprocedure('public.civil_mcp_delete_library_folder(text,uuid)') is not null
      and to_regprocedure('public.civil_mcp_move_library_papers(text,text[],uuid,uuid)') is not null
      and to_regprocedure('public.civil_mcp_access_token_hook(jsonb)') is not null
      then 'ready' else 'missing' end;

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python and architecture gates
        run: |
          python -m py_compile $(find harness mcp-server pipeline supabase eval -name '*.py' -type f | sort)
          python harness/check_invariants.py
          python harness/test_ga_security.py
      - name: CivilMCP web build
        working-directory: web
        env:
          OPENAI_API_KEY: build-placeholder
          DEEPSEEK_API_KEY: build-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: build-placeholder
          SUPABASE_ANON_KEY: build-placeholder
          MCP_SERVER_API_KEY: build-placeholder
          GUEST_SESSION_HMAC_KEY: build-placeholder
          MCP_URL: http://localhost:8000
        run: npm ci && npm run build

  migrate-preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply CivilMCP migrations to preview database
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          test -n "$SUPABASE_PREVIEW_DB_URL"
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260718090000_civil_ga_backbone_p0.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260720120000_civil_discipline_and_luna_defaults.sql
          billing_state=$(psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_STATE_SQL")
          if [[ "$billing_state" == "absent" ]]; then
            for migration in $CIVIL_BILLING_MIGRATIONS; do
              psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
            done
          elif [[ "$billing_state" != "ready" ]]; then
            echo "Refusing to replay stateful billing migrations over a partial schema." >&2
            exit 1
          fi
          test "$(psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_STATE_SQL")" = "ready"
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813120000_civil_stripe_event_idempotency.sql
          test "$(psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_HARDENING_SQL")" = "ready"
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260724120000_civil_source_catalog.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812160000_civil_lexical_retrieval_fallback.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812170000_civil_public_support.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812180000_civil_product_events.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812190000_bound_civil_lexical_fallback.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812200000_remove_lexical_candidate_sort.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813090000_civil_source_rights_manifest.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813091000_civil_federated_discovery.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813100000_civil_catalog_public_rights_boundary.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813110000_civil_transactional_account_deletion.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813140000_civil_bounded_evidence_feed.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260814090000_civil_luna_free_credit_ladder.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260814100000_civil_terra_sol_credit_correction.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815100000_civil_activation_events.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815110000_civil_private_library_and_watches.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815120000_civil_personal_mcp_access.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815130000_civil_mcp_v2_library.sql
          psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815140000_civil_mcp_oauth_audience_hook.sql
          test "$(psql "$SUPABASE_PREVIEW_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_DATA_RPC_STATE_SQL")" = "ready"

  deploy-mcp-preview:
    needs: migrate-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Pull preview environment
        working-directory: mcp-server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MCP_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build and deploy preview artifact
        id: deploy
        working-directory: mcp-server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MCP_PROJECT_ID }}
        run: |
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid MCP preview URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy-web-preview:
    needs: migrate-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Pull preview environment
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build and deploy preview artifact
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid web preview URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

  preview-smoke:
    needs: [deploy-mcp-preview, deploy-web-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARNESS_TARGET: preview
      CORPUS_FINGERPRINT: ${{ vars.CORPUS_FINGERPRINT }}
      MCP_URL: ${{ needs.deploy-mcp-preview.outputs.url }}
      WEB_URL: ${{ needs.deploy-web-preview.outputs.url }}
      MCP_HARNESS_API_KEY: ${{ secrets.MCP_HARNESS_API_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      MCP_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MCP_VERCEL_AUTOMATION_BYPASS_SECRET }}
      WEB_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.WEB_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release commit and preview artifacts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for url in "$MCP_URL" "$WEB_URL"; do
            [[ "$url" == https://* ]] || { echo "Invalid preview URL: $url" >&2; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python harness/run_smoke.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-harness-reports-${{ github.sha }}
          path: harness/reports/
          retention-days: 14

  stage-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.promote == true
    needs: preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    outputs:
      mcp_url: ${{ steps.stage_mcp.outputs.url }}
      mcp_id: ${{ steps.stage_mcp.outputs.id }}
      web_url: ${{ steps.stage_web.outputs.url }}
      web_id: ${{ steps.stage_web.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ vars.GA_PROMOTION_ENABLED }}" = "true"
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Apply CivilMCP migrations to production database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260718090000_civil_ga_backbone_p0.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260720120000_civil_discipline_and_luna_defaults.sql
          billing_state=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_STATE_SQL")
          if [[ "$billing_state" == "absent" ]]; then
            for migration in $CIVIL_BILLING_MIGRATIONS; do
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
            done
          elif [[ "$billing_state" != "ready" ]]; then
            echo "Refusing to replay stateful billing migrations over a partial schema." >&2
            exit 1
          fi
          test "$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_STATE_SQL")" = "ready"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813120000_civil_stripe_event_idempotency.sql
          test "$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_BILLING_HARDENING_SQL")" = "ready"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260724120000_civil_source_catalog.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812160000_civil_lexical_retrieval_fallback.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812170000_civil_public_support.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812180000_civil_product_events.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812190000_bound_civil_lexical_fallback.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812200000_remove_lexical_candidate_sort.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813090000_civil_source_rights_manifest.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813091000_civil_federated_discovery.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813100000_civil_catalog_public_rights_boundary.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813110000_civil_transactional_account_deletion.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813140000_civil_bounded_evidence_feed.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260814090000_civil_luna_free_credit_ladder.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260814100000_civil_terra_sol_credit_correction.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815100000_civil_activation_events.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815110000_civil_private_library_and_watches.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815120000_civil_personal_mcp_access.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815130000_civil_mcp_v2_library.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260815140000_civil_mcp_oauth_audience_hook.sql
          test "$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "$CIVIL_DATA_RPC_STATE_SQL")" = "ready"
      - name: Stage MCP production deployment
        id: stage_mcp
        working-directory: mcp-server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MCP_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid staged MCP URL" >&2; exit 1; }
          host=${url#https://}
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Stage CivilMCP web production deployment
        id: stage_web
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid staged web URL" >&2; exit 1; }
          host=${url#https://}
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
  production-candidate-smoke:
    needs: stage-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      HARNESS_TARGET: production
      HARNESS_DEPLOYMENT_ID: ${{ needs.stage-production.outputs.mcp_id }}:${{ needs.stage-production.outputs.web_id }}
      CORPUS_FINGERPRINT: ${{ vars.CORPUS_FINGERPRINT }}
      MCP_URL: ${{ needs.stage-production.outputs.mcp_url }}
      WEB_URL: ${{ needs.stage-production.outputs.web_url }}
      MCP_HARNESS_API_KEY: ${{ secrets.MCP_HARNESS_API_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      MCP_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MCP_VERCEL_AUTOMATION_BYPASS_SECRET }}
      WEB_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.WEB_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release commit and staged artifacts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for url in "$MCP_URL" "$WEB_URL"; do
            [[ "$url" == https://* ]] || { echo "Invalid staged URL: $url" >&2; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python harness/run_smoke.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-candidate-reports-${{ github.sha }}
          path: harness/reports/
          retention-days: 30

  promote:
    needs: [stage-production, production-candidate-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Promote MCP
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "${{ needs.stage-production.outputs.mcp_url }}" --timeout=5m --yes --token="$VERCEL_TOKEN"
      - name: Promote CivilMCP web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "${{ needs.stage-production.outputs.web_url }}" --timeout=5m --yes --token="$VERCEL_TOKEN"

  production-smoke:
    needs: [stage-production, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HARNESS_TARGET: production
      HARNESS_DEPLOYMENT_ID: ${{ needs.stage-production.outputs.mcp_id }}:${{ needs.stage-production.outputs.web_id }}
      CORPUS_FINGERPRINT: ${{ vars.CORPUS_FINGERPRINT }}
      MCP_URL: ${{ vars.PRODUCTION_MCP_URL }}
      WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      STAGED_MCP_URL: ${{ needs.stage-production.outputs.mcp_url }}
      STAGED_WEB_URL: ${{ needs.stage-production.outputs.web_url }}
      MCP_HARNESS_API_KEY: ${{ secrets.MCP_HARNESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python harness/run_smoke.py --strict
      - name: Verify production aliases use the tested deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          deployment_id() {
            host=${1#https://}
            host=${host%/}
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
          }
          for pair in "$STAGED_MCP_URL|$MCP_URL" "$STAGED_WEB_URL|$WEB_URL"; do
            staged=${pair%%|*}
            canonical=${pair#*|}
            test "$(deployment_id "$staged")" = "$(deployment_id "$canonical")"
          done
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Check production error logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_MCP_PROJECT_ID: ${{ secrets.VERCEL_MCP_PROJECT_ID }}
          VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          for spec in "mcp-server:$VERCEL_MCP_PROJECT_ID" "web:$VERCEL_WEB_PROJECT_ID"; do
            directory=${spec%%:*}
            project_id=${spec#*:}
            (
              cd "$directory"
              VERCEL_PROJECT_ID="$project_id" vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
              VERCEL_PROJECT_ID="$project_id" vercel logs --environment production --level error --since 5m --token="$VERCEL_TOKEN"
            )
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-harness-reports-${{ github.sha }}
          path: harness/reports/
          retention-days: 30
