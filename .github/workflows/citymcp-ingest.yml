name: CityMCP ingest refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger CityMCP read-model ingest
        env:
          CITYMCP_INGEST_URL: ${{ vars.CITYMCP_INGEST_URL || 'https://citymcp.vercel.app/api/ops/ingest/refresh' }}
          OPS_INGEST_SECRET: ${{ secrets.OPS_INGEST_SECRET }}
        run: |
          if [ -z "${OPS_INGEST_SECRET:-}" ]; then
            echo "::error::OPS_INGEST_SECRET repository secret is required for CityMCP near-real-time ingest."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 55 \
            -X POST "${CITYMCP_INGEST_URL}" \
            -H "Authorization: Bearer ${OPS_INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}'
