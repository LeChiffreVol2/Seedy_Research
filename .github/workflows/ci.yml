name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    name: Deploy readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            ops-dashboard/package-lock.json

      - name: Python syntax
        shell: bash
        run: |
          python -m py_compile $(find harness mcp-server pipeline supabase eval -name '*.py' -type f | sort)

      - name: Harness invariants
        run: python harness/check_invariants.py

      - name: Ops dashboard invariants
        run: python harness/check_ops_invariants.py --strict

      - name: Data quality report
        run: python harness/run_data_quality.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        env:
          OPENAI_API_KEY: build-placeholder
          DEEPSEEK_API_KEY: build-placeholder
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: build-placeholder
          SUPABASE_ANON_KEY: build-placeholder
          MCP_SERVER_API_KEY: build-placeholder
          MCP_URL: http://localhost:8000
          NEXT_PUBLIC_MCP_URL: http://localhost:8000
          AGENTIC_CONTEXT_ENABLED: "true"
          ROUTER_PROVIDER: deepseek
          ROUTER_MODEL: deepseek-v4-flash
          MAX_AGENT_STEPS: "3"
          MAX_TOOL_CALLS: "4"
          MAX_CONTEXT_CHUNKS: "8"
          MAX_CONTEXT_TOKENS: "8000"
          CHAT_MAX_BODY_BYTES: "180000"
          CHAT_RATE_LIMIT_WINDOW_SECONDS: "60"
          CHAT_RATE_LIMIT_MAX_CALLS: "24"
          ANSWER_MAX_TOKENS: "1500"
        run: npm run build

      - name: Install ops dashboard dependencies
        working-directory: ops-dashboard
        run: npm ci

      - name: Test ops dashboard
        working-directory: ops-dashboard
        run: npm test

      - name: Typecheck ops dashboard
        working-directory: ops-dashboard
        run: npm run typecheck

      - name: Build ops dashboard
        working-directory: ops-dashboard
        env:
          OPS_DASHBOARD_AUTH_DISABLED: "true"
        run: npm run build

      - name: Optional ops production contracts
        shell: bash
        env:
          RUN_OPS_PRODUCTION_SMOKE: ${{ vars.RUN_OPS_PRODUCTION_SMOKE }}
          OPS_DASHBOARD_URL: ${{ vars.OPS_DASHBOARD_URL }}
          OPS_DASHBOARD_BASIC_AUTH_USER: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_USER }}
          OPS_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_PASSWORD }}
        run: |
          if [ "${RUN_OPS_PRODUCTION_SMOKE}" != "true" ]; then
            echo "Skipping ops production contracts; set RUN_OPS_PRODUCTION_SMOKE=true to enable."
            exit 0
          fi
          python harness/run_ops_api_contracts.py

      - name: Optional ops browser E2E
        shell: bash
        env:
          RUN_OPS_BROWSER_E2E: ${{ vars.RUN_OPS_BROWSER_E2E }}
          OPS_E2E_BASE_URL: ${{ vars.OPS_DASHBOARD_URL }}
          OPS_DASHBOARD_BASIC_AUTH_USER: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_USER }}
          OPS_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_PASSWORD }}
        run: |
          if [ "${RUN_OPS_BROWSER_E2E}" != "true" ]; then
            echo "Skipping ops browser E2E; set RUN_OPS_BROWSER_E2E=true to enable."
            exit 0
          fi
          npm --prefix ops-dashboard exec playwright install --with-deps chromium
          python harness/run_ops_browser_e2e.py --strict

      - name: Production smoke
        shell: bash
        env:
          RUN_PRODUCTION_SMOKE: ${{ vars.RUN_PRODUCTION_SMOKE }}
          MCP_URL: ${{ vars.PRODUCTION_MCP_URL }}
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          MCP_SERVER_API_KEY: ${{ secrets.MCP_SERVER_API_KEY }}
        run: |
          if [ "${RUN_PRODUCTION_SMOKE}" != "true" ]; then
            echo "Skipping production smoke; set repository variable RUN_PRODUCTION_SMOKE=true to enable."
            exit 0
          fi

          missing=0
          for name in MCP_URL WEB_URL MCP_SERVER_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required when RUN_PRODUCTION_SMOKE=true"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          python harness/run_smoke.py --strict
