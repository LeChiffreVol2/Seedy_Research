name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  readiness:
    name: Deploy readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python syntax
        shell: bash
        run: |
          python -m py_compile $(find harness mcp-server pipeline supabase eval -name '*.py' -type f | sort)

      - name: Harness invariants
        run: |
          python harness/check_invariants.py
          python harness/test_ga_security.py

      - name: Data quality contracts
        run: python -m unittest harness.test_data_quality_integrity

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        env:
          OPENAI_API_KEY: build-placeholder
          DEEPSEEK_API_KEY: build-placeholder
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: build-placeholder
          SUPABASE_ANON_KEY: build-placeholder
          MCP_SERVER_API_KEY: build-placeholder
          GUEST_SESSION_HMAC_KEY: build-placeholder
          MCP_URL: http://localhost:8000
          NEXT_PUBLIC_MCP_URL: http://localhost:8000
          CIVILMCP_OPEN_ACCESS: "true"
          NEXT_PUBLIC_CIVILMCP_OPEN_ACCESS: "true"
          AGENTIC_CONTEXT_ENABLED: "true"
          ROUTER_PROVIDER: openai
          ROUTER_MODEL: gpt-5.6-luna
          TRANSLATION_MODEL: gpt-5.6-luna
          MAX_AGENT_STEPS: "3"
          MAX_TOOL_CALLS: "4"
          MAX_CONTEXT_CHUNKS: "8"
          MAX_CONTEXT_TOKENS: "8000"
          CHAT_MAX_BODY_BYTES: "180000"
          CHAT_GUEST_REQUESTS_PER_MINUTE: "3"
          CHAT_GUEST_REQUESTS_PER_HOUR: "30"
          CHAT_AUTH_REQUESTS_PER_MINUTE: "10"
          CHAT_AUTH_REQUESTS_PER_HOUR: "60"
          ANSWER_MAX_TOKENS: "1500"
        run: npm run build
