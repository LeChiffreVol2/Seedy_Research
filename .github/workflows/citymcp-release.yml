name: CityMCP preview and promote

on:
  # Archived / maintenance-only: preview and promotion require an explicit
  # maintainer dispatch. The existing production deployment is left untouched.
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the verified CityMCP artifact to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: citymcp-release-${{ github.event_name == 'workflow_dispatch' && 'promotion' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  VERCEL_CLI_VERSION: 56.3.1

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin release commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: citymcp/ops-dashboard/package-lock.json
      - name: CityMCP source gate
        run: |
          python -m py_compile citymcp/harness/*.py
          python citymcp/harness/check_ops_invariants.py --strict
      - name: CityMCP tests and build
        working-directory: citymcp/ops-dashboard
        env:
          OPS_DASHBOARD_AUTH_DISABLED: "true"
        run: npm ci && npm test && npm run typecheck && npm run build

  deploy-preview:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Build and deploy CityMCP preview
        id: deploy
        working-directory: citymcp/ops-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OPS_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid CityMCP preview URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

  preview-smoke:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HARNESS_TARGET: preview
      OPS_DASHBOARD_URL: ${{ needs.deploy-preview.outputs.url }}
      OPS_E2E_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
      OPS_DASHBOARD_BASIC_AUTH_USER: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_USER }}
      OPS_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python citymcp/harness/run_ops_api_contracts.py
      - name: Browser regression
        run: |
          npm --prefix citymcp/ops-dashboard ci
          npm --prefix citymcp/ops-dashboard exec playwright install --with-deps chromium
          python citymcp/harness/run_ops_browser_e2e.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citymcp-preview-reports-${{ github.sha }}
          path: harness/reports/
          retention-days: 14

  stage-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote == true
    needs: preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      url: ${{ steps.stage.outputs.url }}
      id: ${{ steps.stage.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Stage CityMCP production artifact
        id: stage
        working-directory: citymcp/ops-dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OPS_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")
          [[ "$url" == https://* ]] || { echo "Invalid staged CityMCP URL" >&2; exit 1; }
          host=${url#https://}
          id=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  production-candidate-smoke:
    needs: stage-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      HARNESS_TARGET: production
      HARNESS_DEPLOYMENT_ID: ${{ needs.stage-production.outputs.id }}
      OPS_DASHBOARD_URL: ${{ needs.stage-production.outputs.url }}
      OPS_E2E_BASE_URL: ${{ needs.stage-production.outputs.url }}
      OPS_DASHBOARD_BASIC_AUTH_USER: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_USER }}
      OPS_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python citymcp/harness/run_ops_api_contracts.py
      - name: Browser regression
        run: |
          npm --prefix citymcp/ops-dashboard ci
          npm --prefix citymcp/ops-dashboard exec playwright install --with-deps chromium
          python citymcp/harness/run_ops_browser_e2e.py --strict

  promote:
    needs: [stage-production, production-candidate-smoke]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: npm install --global vercel@${VERCEL_CLI_VERSION}
      - name: Promote CityMCP
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "${{ needs.stage-production.outputs.url }}" --timeout=5m --yes --token="$VERCEL_TOKEN"

  production-smoke:
    needs: [stage-production, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      OPS_DASHBOARD_URL: ${{ vars.OPS_DASHBOARD_URL }}
      OPS_DASHBOARD_BASIC_AUTH_USER: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_USER }}
      OPS_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.OPS_DASHBOARD_BASIC_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python citymcp/harness/run_ops_api_contracts.py
